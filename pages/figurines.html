<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Collection Figurines</title>
<link rel="icon" href="../favicon.png">
<link href="../style.css" rel="stylesheet" />
</head>

<body>

<header class="nav">
    <a href="../index.html" class="logo">✨ Disneyland</a>
    <a href="collection.html" class="dropbtn">Collection Pin's</a>
    <a href="pin's.html" class="dropbtn">Pin's du Mois</a>
    <a href="last_months.html" class="dropbtn">Anciens Pin's</a>
    <a href="figurines.html" class="dropbtn">Figurines</a>
</header>

<h1 class="titre">Collection de Figurines</h1>


<div class="boxcontainer">
    <div class="pin-box" style="background: linear-gradient(135deg, #004aad, #cb6ce6);">
        <img class="pin-collection" src="../figurines/yzma_&_kronk.png" alt="Figurine Yzma et Kronk">
        <img class="pin-collection" src="../figurines/aurore.png" alt="Figurine Aurore">
        <img class="pin-collection" src="../figurines/boule_mickey_fantasia.png" alt="Figurine boule Mickey Fantasia">
        <img class="pin-collection" src="../figurines/boule_winnie_&amp;_tigrou.png" alt="Figurine boule Winnie et Tigrou">
        <img class="pin-collection" src="../figurines/mickey_baguette.png" alt="Figurine Mickey baguette">
        <img class="pin-collection" src="../figurines/mickey_fantasia.png" alt="Figurine Mickey Fantasia">
        <img class="pin-collection" src="../figurines/mushu.png" alt="Figurine Mushu">
        <img class="pin-collection" src="../figurines/olaf.png" alt="Figurine Olaf">
        <img class="pin-collection" src="../figurines/picsou.png" alt="Figurine Picsou">
        <img class="pin-collection" src="../figurines/raiponce.png" alt="Figurine Raiponce">
        <img class="pin-collection" src="../figurines/remy.png" alt="Figurine Rémy">
        <img class="pin-collection" src="../figurines/stitch.png" alt="Figurine Stitch">
        <img class="pin-collection" src="../figurines/tic_&amp;_tac_horloge.png" alt="Figurine Tic et Tac horloge">
        <img class="pin-collection" src="../figurines/tigrou_petit_gourou.png" alt="Figurine Tigrou petit gourou">
    </div>
</div>

<audio id="music" src="../Kingdom Dance (From TangledScore).mp3" loop></audio>

<!-- Menu de contrôle de la musique -->
<div id="music-floating-btn">🎵</div>
<div id="music-controls" class="hidden">
    <button id="play-pause-btn">⏸️</button>
    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
</div>

<script>
const music = document.getElementById("music");
const playPauseBtn = document.getElementById("play-pause-btn");
const volumeSlider = document.getElementById("volume-slider");
const floatingBtn = document.getElementById("music-floating-btn");
const controls = document.getElementById("music-controls");

window.addEventListener("load", () => {
    let time = parseFloat(localStorage.getItem("musicTime"));
    if (!isNaN(time)) {
        music.currentTime = time;
    }

    let savedVolume = parseFloat(localStorage.getItem("musicVolume"));
    if (!isNaN(savedVolume)) {
        music.volume = savedVolume;
        volumeSlider.value = savedVolume;
    } else {
        music.volume = 0.5;
        volumeSlider.value = 0.5;
    }

    let wasPlaying = localStorage.getItem("musicPlaying") === "true";
    if (wasPlaying) {
        let promise = music.play();
        if (promise !== undefined) {
            promise.catch(() => {
                console.log("Lecture automatique bloquée, appuyez sur Play.");
            });
        }
    } else {
        music.pause();
    }

    playPauseBtn.textContent = music.paused ? "▶️" : "⏸️";
});

setInterval(() => {
    localStorage.setItem("musicTime", music.currentTime);
}, 500);

window.addEventListener("beforeunload", () => {
    localStorage.setItem("musicTime", music.currentTime);
});

floatingBtn.addEventListener("click", () => {
    controls.classList.toggle("hidden");
});

playPauseBtn.addEventListener("click", () => {
    if (music.paused) {
        music.play();
        playPauseBtn.textContent = "⏸️";
        localStorage.setItem("musicPlaying", "true");
    } else {
        music.pause();
        playPauseBtn.textContent = "▶️";
        localStorage.setItem("musicPlaying", "false");
    }
});

volumeSlider.addEventListener("input", () => {
    music.volume = parseFloat(volumeSlider.value);
    localStorage.setItem("musicVolume", music.volume.toString());
});

music.addEventListener("ended", () => {
    playPauseBtn.textContent = "▶️";
    localStorage.setItem("musicPlaying", "false");
});

music.addEventListener("pause", () => {
    localStorage.setItem("musicPlaying", "false");
});

music.addEventListener("play", () => {
    localStorage.setItem("musicPlaying", "true");
});
</script>

</body>
</html>
