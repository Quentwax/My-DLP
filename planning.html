<script>
document.querySelectorAll(".dropbtn").forEach(btn => {
    btn.addEventListener("click", () => {

        let content = btn.nextElementSibling;

        // Ferme les autres menus
        document.querySelectorAll(".content").forEach(menu => {
            if(menu !== content) menu.classList.remove("open");
        });

        content.classList.toggle("open");
    });
});
</script>

<h1 class="titre">Mon Calendrier ✨</h1>

<!-- Calendrier -->
<div id="calendar-container">
    <div id="calendar-header">
        <button id="prev-month">◀</button>
        <h2 id="month-year"></h2>
        <button id="next-month">▶</button>
    </div>
    <div id="calendar-grid">
        <div class="day-name">Dim</div>
        <div class="day-name">Lun</div>
        <div class="day-name">Mar</div>
        <div class="day-name">Mer</div>
        <div class="day-name">Jeu</div>
        <div class="day-name">Ven</div>
        <div class="day-name">Sam</div>
    </div>
</div>

<!-- Modal pour ajouter des détails -->
<div id="event-modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>

        <div id="modal-view" class="modal-view hidden">
            <h3 id="view-date"></h3>
            <div id="view-actions" class="view-actions">
                <button id="modify-event" class="action-button modify">Modifier</button>
                <button id="activities-btn" class="action-button activities hidden">Activités</button>
                <button id="delete-event" class="action-button delete">Supprimer</button>
            </div>
            <div id="view-details-container"></div>
            <button id="switch-to-add" class="link-button">Ajouter un événement</button>
        </div>

        <div id="modal-activities" class="modal-activities hidden">
            <h3 id="activities-title">Activités du <span id="activities-date"></span></h3>
            <div id="activities-list-container"></div>
            <div id="add-activity-section">
                <h4>Ajouter une attraction</h4>
                <select id="activity-select">
                    <option value="">Sélectionner une attraction...</option>
                </select>
                <label style="display:block; margin:8px 0; font-weight:600; color:#333;"><input type="checkbox" id="activity-done" style="margin-right:8px;">Fait par ma famille sans moi</label>
                <button id="add-activity-btn">Ajouter</button>
            </div>
            <button id="back-to-event" class="link-button">Retour</button>
        </div>

        <div id="modal-add" class="modal-add">
            <h3 id="modal-title">Ajouter un événement</h3>
            <label for="start-date">Date de début:</label>
            <input type="date" id="start-date">
            <label for="end-date">Date de fin (optionnel):</label>
            <input type="date" id="end-date">
            <textarea id="event-details" placeholder="Détails de l'événement..."></textarea>
            <button id="save-event">Sauvegarder</button>
        </div>
    </div>
</div>







                                                    <!-- Menu de contrôle de la musique -->
<audio id="music"></audio>
<script>
const music = document.getElementById("music");

// Playlist des chansons
const playlist = [
    "Kingdom Dance (From TangledScore).mp3",
    "Tales of Magic.mp3"
];
let currentSongIndex = 0;

// Charger la chanson actuelle
function loadSong(index) {
    music.src = playlist[index];
    music.load();
}

// Initialiser avec la première chanson
loadSong(currentSongIndex);

window.addEventListener("load", () => {
    // RESTAURER LE TEMPS
    let time = parseFloat(localStorage.getItem("musicTime"));
    if (!isNaN(time)) {
        music.currentTime = time;
    }

    // RESTAURER LE VOLUME
    let savedVolume = parseFloat(localStorage.getItem("musicVolume"));
    if (!isNaN(savedVolume)) {
        music.volume = savedVolume;
        volumeSlider.value = savedVolume;
    } else {
        music.volume = 0.5;
        volumeSlider.value = 0.5;
    }

    // RESTAURER L'ÉTAT DE LECTURE
    let wasPlaying = localStorage.getItem("musicPlaying") === "true";
    if (wasPlaying) {
        let promise = music.play();
        if (promise !== undefined) {
            promise.catch(() => {
                // Navigation inter-pages peut empêcher autoplay sans interaction utilisateur
                console.log("Lecture automatique bloquée, appuyez sur Play.");
            });
        }
    } else {
        music.pause();
    }

    playPauseBtn.textContent = music.paused ? "▶️" : "⏸️";
});

/* SAUVEGARDER EN CONTINU */
setInterval(() => {
    localStorage.setItem("musicTime", music.currentTime);
}, 500);
</script>
<script>
window.addEventListener("beforeunload", () => {
    localStorage.setItem("musicTime", music.currentTime);
});
</script>


<div id="music-floating-btn">🎵</div>
<div id="music-controls" class="hidden">
    <button id="play-pause-btn">⏸️</button>
    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
</div>

<script>
const playPauseBtn = document.getElementById("play-pause-btn");
const volumeSlider = document.getElementById("volume-slider");
const floatingBtn = document.getElementById("music-floating-btn");
const controls = document.getElementById("music-controls");

// Initialiser le volume au chargement (sera écrasé par la restauration ci-dessus)
music.volume = 0.5;

// Toggle contrôle
floatingBtn.addEventListener("click", () => {
    controls.classList.toggle("hidden");
});

// Lecture/pause
playPauseBtn.addEventListener("click", () => {
    if (music.paused) {
        music.play();
        playPauseBtn.textContent = "⏸️";
        localStorage.setItem("musicPlaying", "true");
    } else {
        music.pause();
        playPauseBtn.textContent = "▶️";
        localStorage.setItem("musicPlaying", "false");
    }
});

// Slider volume
volumeSlider.addEventListener("input", () => {
    music.volume = parseFloat(volumeSlider.value);
    localStorage.setItem("musicVolume", music.volume.toString());
});

// Mettre à jour l'icône quand la musique se termine
music.addEventListener("ended", () => {
    playPauseBtn.textContent = "▶️";
    localStorage.setItem("musicPlaying", "false");
});

// Sauvegarder le statut lors de changement immédiat
music.addEventListener("pause", () => {
    localStorage.setItem("musicPlaying", "false");
});

music.addEventListener("play", () => {
    localStorage.setItem("musicPlaying", "true");
});
</script>
                                                <!-- FIN Menu de contrôle de la musique -->

<!-- Script pour le calendrier -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBb-2GlOsnUDzDXZ8-mgd6XIr8ny4ZkJoo",
  authDomain: "my-disneyland-paris.firebaseapp.com",
  databaseURL: "https://my-disneyland-paris-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "my-disneyland-paris",
  storageBucket: "my-disneyland-paris.firebasestorage.app",
  messagingSenderId: "787833723893",
  appId: "1:787833723893:web:0cd3c3f0f01dd7e8c09ebc"
};

// INITIALISATION (dans le bon ordre)
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

// REF
const eventsRef = ref(db, 'planning/events');
const activitiesRef = ref(db, 'planning/activities');

// Liste d'attractions disponibles
const attractionsDB = {
  "btm": "Big Thunder Mountain",
  "space": "Hyperspace Mountain",
  "indiana_jones": "Indiana Jones",
  "pirates": "Pirates of the Caribbean",
  "buzz": "Buzz Lightyear",
  "dumbo": "Dumbo",
  "small_world": "It's a Small World",
  "star_tours": "Star Tours",
  "flight_force": "Flight Force",
  "web": "WEB Adventure",
  "crush_coaster": "Crush Coaster",
  "frozen": "Frozen Ever After",
  "peter_pan": "Peter Pan's Flight",
  "thunder_mesa": "Thunder Mesa Riverboat",
  "phantom_manor": "Phantom Manor",
  "mad_hatter_tea_cups": "Mad Hatter's Tea Cups",
  "casey_jr": "Casey Jr.",
  "cabane_robinson": "La Cabane des Robinson",
  "nautilus": "Le Nautilus",
  "carrousel_lancelot": "Le Carrousel de Lancelot",
  "autopia": "Autopia",
  "railroad": "Disneyland Railroad",
  "pinocchio": "Pinocchio",
  "orbitron": "Orbitron",
  "labyrinthe_alice": "Le Labyrinthe d'Alice",
  "blanche_neige": "Blanche-Neige",
  "passage_aladdin": "Le Passage Enchanté d'Aladdin",
  "contes_fees": "Le Pays des Contes de Fées",
  "tower_terror": "Tower Of Terror",
  "ratatouille": "Ratatouille",
  "cars_road_trip": "Cars Road Trip",
  "cars_quatre_roues": "Cars Quatre Roues Rallye",
  "tapis_volants": "Les Tapis Volants",
  "raiponce_spin": "Raiponce Tangled Spin",
  "rc_racer": "RC Racer",
  "slinky_dog": "Slinky Dog Zigzag Spin",
  "toy_soldiers": "Toy Soldiers Parachute Drop"
};

let currentDate = new Date();
let events = {};
let activities = {};
let selectedDate = null;
let editingEventId = null;

function reorderActivities(date, sourceIndex, targetIndex) {
    const dayActivities = activities[date];
    if (!dayActivities || sourceIndex === targetIndex || sourceIndex < 0 || targetIndex < 0) return;
    const [moved] = dayActivities.splice(sourceIndex, 1);
    dayActivities.splice(targetIndex, 0, moved);
}

function getEventsForDate(dateStr) {
    return Object.entries(events).filter(([id, event]) => {
        const start = new Date(event.start);
        const end = new Date(event.end || event.start);
        const date = new Date(dateStr);
        return date >= start && date <= end;
    });
}

function renderCalendar() {
    const monthYear = document.getElementById('month-year');
    const calendarGrid = document.getElementById('calendar-grid');

    while (calendarGrid.children.length > 7) {
        calendarGrid.removeChild(calendarGrid.lastChild);
    }

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    monthYear.textContent = new Date(year, month).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.classList.add('day', 'empty');
        calendarGrid.appendChild(emptyCell);
    }

    for (let day = 1; day <= daysInMonth; day++) {
        const dayCell = document.createElement('div');
        dayCell.classList.add('day');
        dayCell.textContent = day;
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        dayCell.dataset.date = dateStr;

        if (hasEventOnDate(dateStr)) {
            dayCell.classList.add('has-event');
        }

        dayCell.addEventListener('click', () => openModal(dateStr));
        calendarGrid.appendChild(dayCell);
    }
}

function hasEventOnDate(dateStr) {
    return getEventsForDate(dateStr).length > 0;
}

function showAddView(date, eventId = null) {
    selectedDate = date;
    editingEventId = eventId;
    const modal = document.getElementById('event-modal');
    const modalAdd = document.getElementById('modal-add');
    const modalView = document.getElementById('modal-view');
    const startDate = document.getElementById('start-date');
    const endDate = document.getElementById('end-date');
    const eventDetails = document.getElementById('event-details');
    const modalTitle = document.getElementById('modal-title');

    modalView.classList.add('hidden');
    modalAdd.classList.remove('hidden');

    if (eventId && events[eventId]) {
        const event = events[eventId];
        modalTitle.textContent = 'Modifier un événement';
        startDate.value = event.start;
        endDate.value = event.end || event.start;
        eventDetails.value = event.details;
    } else {
        modalTitle.textContent = 'Ajouter un événement';
        startDate.value = date;
        endDate.value = '';
        eventDetails.value = '';
    }
    modal.style.display = 'flex';
}

function showEventView(date) {
    selectedDate = date;
    editingEventId = null;
    const modal = document.getElementById('event-modal');
    const modalAdd = document.getElementById('modal-add');
    const modalView = document.getElementById('modal-view');
    const activitiesModal = document.getElementById('modal-activities');
    const viewDate = document.getElementById('view-date');
    const viewDetailsContainer = document.getElementById('view-details-container');
    const activitiesBtn = document.getElementById('activities-btn');
    const switchToAddBtn = document.getElementById('switch-to-add');

    modalAdd.classList.add('hidden');
    activitiesModal.classList.add('hidden');
    modalView.classList.remove('hidden');

    viewDate.textContent = new Date(date).toLocaleDateString('fr-FR');
    const eventsForDate = getEventsForDate(date);
    const firstEvent = eventsForDate[0];
    if (firstEvent) {
        const [eventId, event] = firstEvent;
        editingEventId = eventId;
    }
    viewDetailsContainer.innerHTML = eventsForDate.map(([eventId, event]) => {
        const displayEnd = event.end && event.end !== event.start ? ` - ${event.end}` : '';
        return `
            <div class="event-summary">
                <h4>${event.start}${displayEnd}</h4>
                <p>${event.details.replace(/\n/g, '<br>')}</p>
            </div>
        `;
    }).join('');

    // Afficher le bouton "Activités" et changer le texte du bouton "Ajouter"
    activitiesBtn.classList.remove('hidden');
    switchToAddBtn.textContent = 'Ajouter une activité';

    modal.style.display = 'flex';
}

function showActivityView(date) {
    selectedDate = date;
    const modal = document.getElementById('event-modal');
    const activitiesModal = document.getElementById('modal-activities');
    const modalView = document.getElementById('modal-view');
    const activitiesDateSpan = document.getElementById('activities-date');
    const activitiesListContainer = document.getElementById('activities-list-container');
    const activitySelect = document.getElementById('activity-select');

    modalView.classList.add('hidden');
    activitiesModal.classList.remove('hidden');

    activitiesDateSpan.textContent = new Date(date).toLocaleDateString('fr-FR');

    // Afficher les activités du jour
    const rawDayActivities = (activities[date] || []);
    const dayActivities = rawDayActivities.map(item => {
        if (typeof item === 'string') return { id: item, family: false };
        if (item.family !== undefined) return item;
        if (item.done !== undefined) return { id: item.id, family: false };
        return { id: item.id, family: false };
    });
    activitiesListContainer.innerHTML = dayActivities.length === 0 
        ? '<p style="color: #999;">Aucune activité pour ce jour</p>'
        : dayActivities.map((activity, index) => `
            <div class="activity-item" draggable="true" data-index="${index}">
                <span>${attractionsDB[activity.id] || activity.id}${activity.family ? '<span class="family-badge">Famille</span>' : ''}</span>
                <button onclick="removeActivity('${date}', ${index})" class="remove-btn">✕</button>
            </div>
        `).join('');

    if (dayActivities.length > 0) {
        addActivityDragHandlers(date);
    }

    // Remplir le select
    activitySelect.innerHTML = '<option value="">Sélectionner une attraction...</option>';
    Object.entries(attractionsDB).forEach(([id, name]) => {
        activitySelect.innerHTML += `<option value="${id}">${name}</option>`;
    });

    modal.style.display = 'flex';
}

function addActivityDragHandlers(date) {
    document.querySelectorAll('#activities-list-container .activity-item').forEach(item => {
        item.addEventListener('dragstart', event => {
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', item.dataset.index);
            item.classList.add('dragging');
        });

        item.addEventListener('dragend', () => {
            item.classList.remove('dragging');
        });

        item.addEventListener('dragover', event => {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            item.classList.add('drag-over');
        });

        item.addEventListener('dragleave', () => {
            item.classList.remove('drag-over');
        });

        item.addEventListener('drop', async event => {
            event.preventDefault();
            item.classList.remove('drag-over');
            const sourceIndex = Number(event.dataTransfer.getData('text/plain'));
            const targetIndex = Number(item.dataset.index);
            if (isNaN(sourceIndex) || isNaN(targetIndex) || sourceIndex === targetIndex) return;
            reorderActivities(date, sourceIndex, targetIndex);
            await set(activitiesRef, activities);
            showActivityView(date);
        });
    });
}

function openModal(date) {
    if (hasEventOnDate(date)) {
        showEventView(date);
    } else {
        showAddView(date);
    }
}

function closeModal() {
    document.getElementById('event-modal').style.display = 'none';
}

document.getElementById('prev-month').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
});

document.getElementById('next-month').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
});

document.querySelector('.close').addEventListener('click', closeModal);

document.getElementById('switch-to-add').addEventListener('click', () => {
    showAddView(selectedDate);
});

document.getElementById('activities-btn').addEventListener('click', () => {
    showActivityView(selectedDate);
});

document.getElementById('back-to-event').addEventListener('click', () => {
    showEventView(selectedDate);
});

document.getElementById('add-activity-btn').addEventListener('click', async () => {
    const activitySelect = document.getElementById('activity-select');
    const attractionId = activitySelect.value;
    const familyChecked = document.getElementById('activity-done').checked;

    if (!attractionId) {
        alert('Veuillez sélectionner une attraction');
        return;
    }

    if (!activities[selectedDate]) {
        activities[selectedDate] = [];
    }

    // Normalize existing items to objects {id, family}
    activities[selectedDate] = activities[selectedDate].map(item => {
        if (typeof item === 'string') return { id: item, family: false };
        if (item.family !== undefined) return item;
        if (item.done !== undefined) return { id: item.id, family: false };
        return { id: item.id, family: false };
    });

    activities[selectedDate].push({ id: attractionId, family: familyChecked });
    await set(activitiesRef, activities);
    showActivityView(selectedDate);
});

window.removeActivity = async function(date, index) {
    if (activities[date]) {
        activities[date].splice(index, 1);
        if (activities[date].length === 0) {
            delete activities[date];
        }
        await set(activitiesRef, activities);
        showActivityView(date);
    }
};

document.getElementById('modify-event').addEventListener('click', () => {
    if (editingEventId) {
        showAddView(selectedDate, editingEventId);
    }
});

document.getElementById('delete-event').addEventListener('click', async () => {
    if (!editingEventId) return;
    delete events[editingEventId];
    await set(eventsRef, events);
    if (hasEventOnDate(selectedDate)) {
        showEventView(selectedDate);
    } else {
        closeModal();
    }
});

document.getElementById('save-event').addEventListener('click', async () => {
    const startDate = document.getElementById('start-date').value;
    const endDate = document.getElementById('end-date').value;
    const eventDetails = document.getElementById('event-details').value;

    if (startDate && eventDetails) {
        const eventId = editingEventId || Date.now().toString();
        events[eventId] = {
            start: startDate,
            end: endDate || startDate,
            details: eventDetails
        };
        await set(eventsRef, events);
        showEventView(startDate);
    }
});

window.addEventListener('click', (event) => {
    const modal = document.getElementById('event-modal');
    if (event.target === modal) {
        closeModal();
    }
});

onAuthStateChanged(auth, (user) => {
    if (!user) {
        console.log("❌ Pas connecté");
        return;
    }

    console.log("✅ Connecté :", user.email);

    onValue(eventsRef, (snapshot) => {
        events = snapshot.val() || {};
        renderCalendar();
    });

    onValue(activitiesRef, (snapshot) => {
        activities = snapshot.val() || {};
    });
});
</script>
